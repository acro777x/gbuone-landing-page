<!doctype html>
<!--
  GBU One — PUBLIC email confirmation / password reset relay page.

  Deploy at https://gbuone.space/auth/confirm/ (folder index.html).

  IMPORTANT DESIGN (changed after the Phase 6 audit):
  The previous version verified the Supabase token IN THE BROWSER. That created
  a browser session the app could never access, so signup "succeeded" on the
  website but the app opened unauthenticated; password reset had no path to
  the app's updateUser() form. This version captures the one-time token before
  scrubbing the URL and RELAYS it to the app, which verifies it itself and gets
  a real session.

  Supabase Dashboard -> Authentication -> URL Configuration:
      Site URL:       https://gbuone.space
      Redirect URLs:  https://gbuone.space/auth/confirm
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confirming — GBU One</title>
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https://pjnxllnncsoroevgfbmt.supabase.co; img-src 'self' data:; font-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'" />
  <script>
    // Capture the one-time token BEFORE removing it from the URL. The previous
    // page scrubbed first and then read location.search, so it always saw an
    // empty string and could never verify anything.
    try {
      window.__GBU_LINK__ = location.search || '';
      // Supabase's standard ConfirmationURL flow puts the token in the URL
      // FRAGMENT, not the query string. Capture it before scrubbing too.
      window.__GBU_HASH__ = location.hash || '';
    } catch (e) { window.__GBU_LINK__ = ''; window.__GBU_HASH__ = ''; }
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  </script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           display: grid; place-items: center; min-height: 100vh; margin: 0;
           background: #fffaf6; color: #1f2937; text-align: center; padding: 24px; }
    main { max-width: 440px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { line-height: 1.6; color: #4b5563; }
    a.button { display: inline-block; margin-top: 18px; padding: 12px 22px;
               border-radius: 999px; background: #c2410c; color: #fff;
               text-decoration: none; font-weight: 600; }
    a.button.secondary { background: transparent; color: #c2410c; border: 1px solid #c2410c; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">One moment…</h1>
    <p id="message">Finishing your email confirmation.</p>
    <a id="open" class="button" href="gbuone://auth/confirm" hidden>Open GBU One</a>
    <a id="again" class="button secondary" href="https://gbuone.space/" hidden>Return to website</a>
  </main>

  <script>
    (function () {
      'use strict';
      var ALLOWED_TYPES = ['signup', 'recovery'];
      var title = document.getElementById('title');
      var message = document.getElementById('message');
      var open = document.getElementById('open');
      var again = document.getElementById('again');

      function fail(text) {
        title.textContent = 'Could not confirm';
        title.className = 'error';
        message.textContent = text;
        again.hidden = false;
      }

      var query, fragment;
      try {
        query = new URLSearchParams(window.__GBU_LINK__ || '');
        fragment = new URLSearchParams((window.__GBU_HASH__ || '').replace(/^#/, ''));
      } catch (e) { fail('This link could not be read. Open the newest email from GBU One.'); return; }

      var tokenHash = (query.get('token_hash') || '').trim();
      var type = (query.get('type') || '').trim();
      var accessToken = (fragment.get('access_token') || '').trim();
      var refreshToken = (fragment.get('refresh_token') || '').trim();
      var fragType = (fragment.get('type') || '').trim();

      function openApp(link) {
        open.href = link;
        open.hidden = false;
        try { location.href = link; } catch (e) { /* manual button remains */ }
      }

      // FORMAT 1 (preferred): token_hash + type in the query string. Relay the
      // same one-time token to the app; it calls verifyOtp() and gets a session.
      if (tokenHash) {
        if (ALLOWED_TYPES.indexOf(type) === -1) {
          fail('This confirmation link is not supported. Open the newest email from GBU One.');
          return;
        }
        var deepLink = 'gbuone://auth/confirm?token_hash=' +
          encodeURIComponent(tokenHash) + '&type=' + encodeURIComponent(type);
        open.href = deepLink;
        open.hidden = false;
        title.textContent = 'Opening GBU One';
        message.textContent = type === 'recovery'
          ? 'Your reset link is valid. GBU One will open so you can choose a new password.'
          : 'Your email is being confirmed in GBU One.';
        try { location.href = deepLink; } catch (e) { /* manual button remains */ }
        return;
      }

      // FORMAT 2: Supabase's standard ConfirmationURL puts the tokens in the
      // URL FRAGMENT. Verify them against the Auth server with the PUBLIC key,
      // then open the app's honest result screen. We never write the tokens to
      // the DOM, console or another URL, and never claim to have signed in.
      if (accessToken && refreshToken && ALLOWED_TYPES.indexOf(fragType) !== -1) {
        var config = window.GBU_ONE_CONFIG || {};
        var url = config.SUPABASE_URL || '';
        var key = config.PUBLISHABLE_KEY || '';
        if (!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(url) ||
            !/^sb_publishable_[A-Za-z0-9_-]+$/.test(key)) {
          fail('This page is not configured. Ask the app owner to run the website setup.');
          return;
        }
        title.textContent = 'Checking your link';
        fetch(url.replace(/\/$/, '') + '/auth/v1/user', {
          headers: { apikey: key, Authorization: 'Bearer ' + accessToken }
        })
          .then(function (r) { if (!r.ok) throw new Error('invalid'); return r.json(); })
          .then(function () {
            title.textContent = 'Email link verified';
            message.textContent = fragType === 'recovery'
              ? 'Your reset link is valid. Open GBU One to choose a new password.'
              : 'Your email is verified. Open GBU One and sign in to continue.';
            openApp('gbuone://auth/done?verified=1');
          })
          .catch(function () {
            fail('This link is invalid or has expired. Open the newest email from GBU One.');
          });
        return;
      }

      fail('This link has no confirmation code. Open the newest email from GBU One.');
    })();
  </script>
</body>
</html>

<!doctype html>
<!--
  GBU One — PUBLIC email confirmation / password reset page.

  Deploy at https://gbuone.space/auth/confirm/ (folder index.html).

  Config comes from config.js, generated by:
      node tools/setup_landing_config.js
  Only an sb_publishable_ key may be used here - the website source is public.
  Never put sb_secret_, DB passwords or FCM keys in this folder.

  Supabase Dashboard -> Authentication -> URL Configuration:
      Site URL:       https://gbuone.space
      Redirect URLs:  https://gbuone.space/auth/confirm
                      gbuone://auth/done
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confirming — GBU One</title>
  <!-- Never leak the token_hash to any site the user visits next. -->
  <meta name="referrer" content="no-referrer" />
  <!-- Locked down: no forms, no frames, no plugins, no base tag hijacking. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://esm.sh; style-src 'self' 'unsafe-inline'; connect-src https://pjnxllnncsoroevgfbmt.supabase.co; img-src 'self' data:; font-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'" />
  <!--
    CRITICAL: scrub the one-time token from the URL synchronously in <head>,
    BEFORE the module script (and any third-party script) runs. Otherwise it
    stays in browser history, screenshots, copied links and server logs.
  -->
  <script>
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  </script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           display: grid; place-items: center; min-height: 100vh; margin: 0;
           background: #fffaf6; color: #1f2937; text-align: center; padding: 24px; }
    main { max-width: 420px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { line-height: 1.6; color: #4b5563; }
    a.button { display: inline-block; margin-top: 18px; padding: 12px 22px;
               border-radius: 999px; background: #c2410c; color: #fff;
               text-decoration: none; font-weight: 600; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">One moment…</h1>
    <p id="message">Confirming your email address.</p>
    <a id="open" class="button" href="gbuone://auth/done?verified=1" hidden>Open GBU One</a>
  </main>

  <!-- Generated public config. Must load BEFORE the module below. -->
  <script src="config.js"></script>
  <script type="module">
    // Pinned version: an unpinned CDN import is a supply-chain risk on a
    // public verification page.
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2.49.10";

    const DEEP_LINK = 'gbuone://auth/done?verified=1'; // hardcoded, never from a URL param
    const ALLOWED_TYPES = new Set(['signup', 'recovery']);
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const open = document.getElementById('open');

    // The URL was already scrubbed in <head>. Read it once from the in-memory
    // copy; the token is never written to the DOM, console, a link or a log.
    const params = new URLSearchParams(location.search);
    const tokenHash = params.get('token_hash') || '';
    const code = params.get('code') || '';
    const type = params.get('type') || '';

    let used = false; // one-shot: a page load verifies at most one link
    function fail(text) {
      if (used) return; used = true;
      title.textContent = 'Could not confirm';
      title.className = 'error';
      // Generic message on purpose: never mirror backend error details.
      message.textContent = text;
    }
    function success() {
      if (used) return; used = true;
      title.textContent = 'All set';
      message.textContent = 'Email confirmed. Opening GBU One…';
      open.hidden = false;
      location.href = DEEP_LINK;
    }

    const config = window.GBU_ONE_CONFIG || {};
    const url = config.SUPABASE_URL || '';
    const key = config.PUBLISHABLE_KEY || '';
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(url) ||
        !/^sb_publishable_[A-Za-z0-9_-]+$/.test(key)) {
      fail('This page is not configured. Ask the app owner to run the website setup.');
    } else if (!tokenHash && !code) {
      fail('This link has no confirmation code. Open the newest email from GBU One.');
    } else if (!code && tokenHash && !ALLOWED_TYPES.has(type)) {
      // Fail CLOSED on an unknown type instead of treating it as 'signup'.
      fail('This confirmation link is not supported.');
    } else {
      const supabase = createClient(url, key);
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 10000);
      try {
        if (code) {
          await supabase.auth.exchangeCodeForSession(code);
          success();
        } else {
          const { error } = await supabase.auth.verifyOtp({
            token_hash: tokenHash,
            type: type === 'recovery' ? 'recovery' : 'signup',
          });
          if (error) fail('This link is invalid or has expired. Use the newest email from GBU One.');
          else success();
        }
      } catch {
        fail('Could not verify the link. Use the newest email from GBU One.');
      } finally {
        clearTimeout(timer);
      }
    }
  </script>
</body>
</html>
